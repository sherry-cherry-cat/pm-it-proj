name: Zadanie techniczne
description: Zmiana w kodzie, testach lub konfiguracji
title: "[Task] "
labels: ["task"]
body:
  - type: textarea
    id: description
    attributes:
      label: Co trzeba zrobić?
      placeholder: Dodać testy odrzucenia błędnego hasła master.
    validations:
      required: true
  - type: input
    id: backlog
    attributes:
      label: Powiązanie z backlogiem
      placeholder: SEC-02
  - type: textarea
    id: acceptance
    attributes:
      label: Warunki zakończenia
      placeholder: "- [ ] Testy przechodzą lokalnie i na GitHubie."
