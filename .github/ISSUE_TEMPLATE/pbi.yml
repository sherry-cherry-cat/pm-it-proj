    name: User Story / funkcja
    description: Nowa funkcja z backlogu
    title: "[US] "
    labels: [feature]
    body:
      - type: textarea
        id: story
        attributes:
          label: User Story
          placeholder: "Jako użytkowniczka chcę ..., aby ..."
        validations:
          required: true
      - type: textarea
        id: ac
        attributes:
          label: Kryteria akceptacji
          placeholder: "1. ...
2. ..."
        validations:
          required: true
      - type: dropdown
        id: sprint
        attributes:
          label: Sprint
          options:
            - Sprint 1
            - Sprint 2
            - Sprint 3
            - Poza MVP
