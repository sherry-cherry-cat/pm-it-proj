name: Funkcja (backlog)
description: Opis nowej funkcji w projekcie PasswordVault
title: "[PBI] "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Co chcę zrobić?
      description: Krótki opis funkcji.
      placeholder: Jako użytkownik chcę dodać konto do sejfu.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Jak sprawdzę działanie?
      placeholder: "- [ ] Po dodaniu konta widzę je na liście."
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priorytet
      options: [MUST, SHOULD, COULD]
    validations:
      required: true
