name: SonarQube & Quality Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Analyze
    runs-on: windows-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Zainstaluj SonarScanner i dotnet-coverage
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sonarscanner
          if ($LASTEXITCODE -ne 0) { throw 'Nie udalo sie zainstalowac SonarScanner.' }
          dotnet tool install --global dotnet-coverage
          if ($LASTEXITCODE -ne 0) { throw 'Nie udalo sie zainstalowac dotnet-coverage.' }

      - name: Sprawdz token SonarQube
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw 'Brak SONAR_TOKEN w GitHub Actions Secrets.'
          }

      - name: Przywroc pakiety
        shell: pwsh
        run: |
          dotnet restore 'Password-Vault/Password-Vault.slnx'
          if ($LASTEXITCODE -ne 0) { throw 'Restore nie powiodl sie.' }

      - name: Rozpocznij analize SonarQube
        shell: pwsh
        run: |
          dotnet sonarscanner begin `
            /k:"sherry-cherry-cat_pm-it-proj" `
            /o:"sherry-cherry-cat" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.cs.vscoveragexml.reportsPaths="TestResults/coverage.xml"
          if ($LASTEXITCODE -ne 0) { throw 'SonarScanner begin nie powiodl sie.' }

      - name: Kompiluj rozwiazanie
        shell: pwsh
        run: |
          dotnet build 'Password-Vault/Password-Vault.slnx' --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build nie powiodl sie.' }

      - name: Testy i pokrycie kodu przez dotnet-coverage
        shell: pwsh
        run: |
          $coverageDir = Join-Path $env:GITHUB_WORKSPACE 'TestResults'
          New-Item -ItemType Directory -Force -Path $coverageDir | Out-Null
          $coverageFile = Join-Path $coverageDir 'coverage.xml'
          $testCommand = 'dotnet test Password-Vault/PasswordVault.Tests/PasswordVault.Tests.csproj --configuration Release --no-build --logger trx --results-directory TestResults'
          dotnet-coverage collect $testCommand -f xml -o "$coverageFile"
          if ($LASTEXITCODE -ne 0) { throw 'Testy lub zbieranie pokrycia nie powiodly sie.' }

      - name: Sprawdz raport pokrycia XML
        shell: pwsh
        run: |
          $coverageFile = Join-Path $env:GITHUB_WORKSPACE 'TestResults/coverage.xml'
          if (-not (Test-Path -LiteralPath $coverageFile)) {
            throw 'Brak TestResults/coverage.xml. dotnet-coverage nie wygenerowal raportu.'
          }
          $file = Get-Item -LiteralPath $coverageFile
          Write-Host "Raport pokrycia: $($file.FullName), rozmiar: $($file.Length) bajtow"
          if ($file.Length -lt 200) { throw 'Raport XML jest podejrzanie maly.' }
          try { [xml]$xml = Get-Content -LiteralPath $coverageFile -Raw }
          catch { throw 'Raport pokrycia nie jest poprawnym plikiem XML.' }
          Write-Host "Korzen XML: $($xml.DocumentElement.LocalName)"

      - name: Wyslij analize i pokrycie do SonarQube
        shell: pwsh
        run: |
          dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { throw 'SonarScanner end nie powiodl sie.' }

      - name: Zachowaj raporty testow i pokrycia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            TestResults/**/*.trx
            TestResults/coverage.xml
          if-no-files-found: warn
