name: SonarQube & Quality Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Analyze
    runs-on: windows-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Zainstaluj SonarScanner
        shell: pwsh
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Sprawdz sekret SonarQube
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw 'Brak SONAR_TOKEN w GitHub Actions Secrets.'
          }

      - name: Przywroc pakiety
        shell: pwsh
        run: |
          dotnet restore 'Password-Vault/Password-Vault.slnx'
          if ($LASTEXITCODE -ne 0) { throw 'Restore nie powiodl sie.' }

      - name: Rozpocznij analize SonarQube
        shell: pwsh
        run: |
          dotnet sonarscanner begin `
            /k:"sherry-cherry-cat_pm-it-proj" `
            /o:"sherry-cherry-cat" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" `
            /d:sonar.verbose=true
          if ($LASTEXITCODE -ne 0) { throw 'SonarScanner begin nie powiodl sie.' }

      - name: Kompiluj rozwiazanie
        shell: pwsh
        run: |
          dotnet build 'Password-Vault/Password-Vault.slnx' --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build nie powiodl sie.' }

      - name: Testy z pomiarem pokrycia OpenCover
        shell: pwsh
        run: |
          $coverageDir = Join-Path $env:GITHUB_WORKSPACE 'TestResults'
          dotnet test 'Password-Vault/PasswordVault.Tests/PasswordVault.Tests.csproj' `
            --configuration Release `
            --no-build `
            --results-directory "$coverageDir" `
            --collect:"XPlat Code Coverage;Format=opencover" `
            --logger 'trx;LogFileName=test-results.trx'
          if ($LASTEXITCODE -ne 0) { throw 'Testy nie powiodly sie.' }

      - name: Sprawdz czy raport OpenCover istnieje i zawiera dane
        shell: pwsh
        run: |
          $coverageDir = Join-Path $env:GITHUB_WORKSPACE 'TestResults'
          $reports = @(Get-ChildItem -Path $coverageDir -Recurse -File -Filter 'coverage.opencover.xml' -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
            Get-ChildItem -Path $coverageDir -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw 'Brak pliku coverage.opencover.xml. Sprawdz collect/wersje test runnera.'
          }
          foreach ($report in $reports) {
            Write-Host "Raport OpenCover: $($report.FullName) ($($report.Length) bajtow)"
            [xml]$xml = Get-Content -LiteralPath $report.FullName -Raw
            $summary = $xml.CoverageSession.Summary
            if ($null -eq $summary) { throw "Nieprawidlowy raport OpenCover: $($report.FullName)" }
            $total = [int]$summary.numSequencePoints
            $visited = [int]$summary.visitedSequencePoints
            Write-Host "Punkty kodu: $total; wykonane przez testy: $visited"
            if ($total -eq 0 -or $visited -eq 0) {
              throw 'Raport OpenCover istnieje, ale nie zawiera pokrycia. Sprawdz Coverlet i .NET 10.'
            }
          }

      - name: Wyslij analize i pokrycie do SonarQube
        shell: pwsh
        run: |
          dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { throw 'SonarScanner end nie powiodl sie.' }

      - name: Zachowaj raporty testow i pokrycia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.opencover.xml
          if-no-files-found: warn
