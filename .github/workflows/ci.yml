name: CI .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VaultCLI.slnx

      - name: Build (Release)
        run: dotnet build VaultCLI.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test VaultCLI.slnx --configuration Release --no-build --verbosity normal
