name: Build i testy .NET

on:
  push:
    branches: [main, 'chore/**', 'feature/**', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Zainstaluj .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Przywroc pakiety
        run: dotnet restore 'Password-Vault/Password-Vault.slnx'
      - name: Zbuduj rozwiazanie
        run: dotnet build 'Password-Vault/Password-Vault.slnx' --configuration Release --no-restore
      - name: Uruchom testy
        run: dotnet test 'Password-Vault/Password-Vault.Tests/PasswordVault.Tests.csproj' --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx"
      - name: Zapisz wyniki testow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyniki-testow
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
