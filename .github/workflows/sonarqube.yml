name: SonarQube Cloud - analiza C#

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zainstaluj .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Sprawdz ustawienia SonarQube
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw "Brak SONAR_TOKEN. Dodaj Repository secret w Settings > Secrets and variables > Actions."
          }
          if ([string]::IsNullOrWhiteSpace($env:SONAR_PROJECT_KEY)) {
            throw "Brak SONAR_PROJECT_KEY. Dodaj Repository variable w GitHub Actions."
          }
          if ([string]::IsNullOrWhiteSpace($env:SONAR_ORGANIZATION)) {
            throw "Brak SONAR_ORGANIZATION. Dodaj Repository variable w GitHub Actions."
          }
          Write-Host "Ustawienia SonarQube sa dostepne."

      - name: Zainstaluj SonarScanner dla .NET
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sonarscanner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Analizuj aplikacje C#
        shell: pwsh
        run: |
          dotnet sonarscanner begin /k:"$env:SONAR_PROJECT_KEY" /o:"$env:SONAR_ORGANIZATION" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet build "Password-Vault/Password-Vault.slnx" --configuration Release --no-incremental
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
